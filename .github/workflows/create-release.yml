name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release
        run: |
          node --check foundry-combat-focus.js
          node --test
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const pkg = require('./package.json');
          const manifest = require('./module.json');
          const tag = process.env.GITHUB_REF_NAME;
          assert.equal(tag, `v${pkg.version}`);
          assert.equal(manifest.version, pkg.version);
          assert.equal(manifest.download, `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/foundry-combat-focus-${tag}.zip`);
          assert.ok(fs.existsSync(`changelog/changelog-${tag}.md`));
          NODE

      - name: Package module
        run: >-
          zip -r "foundry-combat-focus-${GITHUB_REF_NAME}.zip"
          foundry-combat-focus.css foundry-combat-focus.js module.json
          README.md Screenshot.jpg screenshots changelog

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "foundry-combat-focus-${GITHUB_REF_NAME}.zip" module.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "Combat Focus $GITHUB_REF_NAME" \
            --notes-file "changelog/changelog-${GITHUB_REF_NAME}.md"
